{"label": "2SLGBTQIA+ 지원", "url": "https://umanitoba.ca/2slgbtqia-community"}, {"label": "위니펙 겨울 준비", "url": "https://umtoday-wordpress.ad.umanitoba.ca/what-to-wear-for-winter-in-winnipeg/"}, {"label": "PSYC 공식 전체 편람", "url": "https://catalog.umanitoba.ca/undergraduate-studies/course-descriptions/psyc/"}, {"label": "WOMN 공식 전체 편람", "url": "https://catalog.umanitoba.ca/undergraduate-studies/course-descriptions/womn/"}], "intro": "캐나다 프레리 지역의 연구 중심 공립대학. 심리학과 여성·젠더 연구를 함께 검토할 수 있어, 정체화에 관한 심리학적 설명과 사회문화적 설명을 연결하기 좋다.", "department": "Psychology와 Women’s and Gender Studies가 있다. 사회·성격·연구방법 과목에 젠더, 신체, 인종·계급·섹슈얼리티 과목을 조합하는 구성이 강점이다.", "faculty": "WGS 교수진 중 Liz Millward는 여성의 공간과 공동체, Jocelyn Thorpe는 젠더·식민주의·환경, Shawna Ferris는 성노동의 재현과 저항을 연구한다. 이들의 연구는 인문사회 접근이며, 심리학 실험실 지도나 교환학생 연구 참여를 보장하지 않는다.", "career": "사회심리·젠더 연구 대학원 탐색, 질적 연구의 질문 만들기, 지역사회 기반 연구에 관심이 있을 때 유리하다. 연구조교나 현장실습은 별도 선발·허가가 필요하다.", "registration": "교환 안내상 심리학 Honours 과정은 제외된다. 일반 심리학 과목도 선수과목 동등성 심사를 거친다. PSYC 2250→2260의 순차 이수 때문에 한 학기에 두 과목을 연속 이수할 수 있다고 가정하면 안 된다.", "housing": "University College의 1인실·식사 플랜을 기준으로 계산했다. 기숙사 유형에 따라 식사 의무와 가격이 달라진다. 교환학생의 특정 방·건물 배정은 확약되지 않는다.", "support": "International Centre에서 사전 온라인 안내, 국제학생 오리엔테이션, Welcome Mentor, 학생 상담 창구를 제공한다.", "gender": "공식 2SLGBTQIA+ 커뮤니티 안내에서 교내 자원과 연결 경로를 제공한다. Two-Spirit를 포함하는 지역 맥락을 접할 수 있다. 실제 주거 배정과 개별 서비스 이용 조건은 담당 부서 확인이 필요하다.", "environment": "위니펙은 이민자 공동체와 원주민·메티스 문화가 공존하는 도시다. 겨울은 길고 매우 춥고 여름은 따뜻하다. 겨울학기는 방한복뿐 아니라 기숙사에서 강의실까지의 이동 동선을 비용·생활 조건으로 고려할 필요가 있다.", "environmentNote": "정성적 지역 안내. 특정 인종 구성만으로 친화성이나 차별 경험을 예측하지 않았다.", "budgetBasis": ["공식 주거 기준: 1학기 1인실 CAD 3,419 + 식사 3,721 + 기숙사 부대비 170 + 교환 관련 비용 150 = 7,460.", "추정 추가액: 교재 500–1,000, 생활·교통 1,200–1,800, 보험 400–700 CAD. 합계 CAD 9,560–10,960."], "risk": "2027-1 2차에 새로 2명이 등장한 사례다. 1차 모집 후 미달이라고 볼 근거가 없다.", "mix": "PSYC 2380 또는 2540 + WOMN 2650 + WOMN 2640 + 선수요건을 충족하는 연구방법 과목. 실제 개설과 시간표 확인 전의 학문적 조합 예시다.", "coverage": "2026–27 학부 편람의 PSYC 69개와 WOMN 30개를 모두 수록했습니다. 실제 학기별 시간표는 확보하지 못해 한 목록으로 제공합니다. 다른 전공의 교차등재 과목 전체까지를 뜻하지는 않습니다.", "safety": {"text": "대학 Security Services는 24시간·주7일 운영하며 Safe Walk/Ride와 UM Safe 앱을 제공합니다. 대학 보안부는 월별 활동·사건 보고서를 공개하므로 지원 직전 최신 자료와 실제 생활 동선을 함께 확인할 수 있습니다. 대학의 보안 활동·신고 건수는 도시 전체 범죄율이나 개인 피해확률과 다르며, 서비스 존재만으로 안전을 보장하지 않습니다. 응급상황은 911 후 교내 보안실에 연락하고, 비응급 동행 서비스는 204-474-9312입니다.", "sources": [{"label": "Manitoba Security Services·월별 보고서", "url": "https://www.umanitoba.ca/security/"}]}, "composition": {"text": "2025–26 Student Affairs Annual Report 39쪽은 International Centre의 incoming 교환학생 37명, 출신 협정기관 26개, 기관 소재국 12개를 보고합니다. 국가별 인원표는 이 보고서에서 확인되지 않아 어느 나라 교환학생이 다수인지 판단할 수 없습니다. 이 집계는 보고서 해당 부서의 교환 프로그램 범위이며 대학의 모든 별도 학부 교환까지 합친 수치로 단정하지 않습니다. 2024–25 보고서에는 25명·18개 기관·10개 국가가 기록되어 있습니다. 참고로 2025 가을 전체 국제학생은 6,278명·123개국·전체의19.7%지만, 이는 교환학생 구성과 별개입니다. 국적·기관 소재국은 인종 통계가 아닙니다.", "sources": [{"label": "2025–26 Student Affairs Annual Report p.39", "url": "https://umanitoba.ca/sites/default/files/2026-09/sa-annual-report-2025-2026.pdf"}, {"label": "2024–25 Student Affairs Annual Report p.41", "url": "https://umanitoba.ca/sites/default/files/2025-09/sa-annual-report-2024-2025-printable.pdf"}, {"label": "Fall 2025 전체 학생 사실·통계", "url": "https://umanitoba.ca/about-um/facts-figures"}]}}, {"id": "douglas", "name": "더글러스 칼리지", "en": "Douglas College", "country": "캐나다", "city": "뉴웨스트민스터 · 코퀴틀람", "period": "1학기", "months": 4, "quota": ["4", "—"], "history": ["3", "3", "—"], "score": [8, 8, 7.5], "tag": "젠더 정체화 과목과 비교적 낮은 예산", "world": "비교 가능한 종합순위 미확인", "worldsrc": "", "psych": null, "psychsrc": "", "budget": {"name": "Douglas", "cur": "CAD", "lo": 9015.2, "hi": 10818.24, "airlo": 150, "airhi": 230, "visa": 30, "krwLow": 1240, "krwHigh": 1540}, "courses": [{"group": "심리학", "code": "PSYC 1100", "title": "An Introduction to Psychology (I)", "credit": "3.00 credits", "description": "심리학 입문 1을 다루는 과목입니다. 자세한 교육내용·평가·선수조건은 연결된 공식 편람에서 확인할 수 있습니다.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "선수과목 없음. 편람 등재가 해당 학기 개설이  Maria Janicki로 시간표에 표시되어 있다. 담당 교수의 파견 학기 재직·강의 배정 및 연구 지도 가능성은 별도 확인 사항이다.", "career": "젠더 관계·자기개념을 다루는 수업, 응용심리학과 상담기술 탐색에 적합하다. 학부 교육 중심의 경험을 기대할 수 있으나 연구실 인턴 자리가 확인된 것은 아니다.", "registration": "GSWS 1102는 선수과목이 없다. 반면 PSYC 3120과 3330은 입문·중급 과목 요건이 있다. 2026 가을 일부 핵심 수업은 대기명단 상태였으며, 캠퍼스가 달라 같은 날 연속 배치에 주의해야 한다.", "housing": "대학 최초 자체 학생 주거시설은 2028년 초 개관 예정이다. 2027년 파견 예산은 교외 임대·홈스테이 기준이다. 신축 기숙사 입주 가능성을 선반영하지 않았다.", "support": "International Student Services의 입국·보험·수강 안내와 국제학생 멘토링, Student Life 오리엔테이션을 이용할 수 있다. 교외 주거 안내는 대학이 모든 업체를 보증하는 의미가 아니다.", "gender": "대학 EDI 자원과 학생회 DSU Pride 연결 경로를 확인했다. 교외 주거에서는 집주인·하우스메이트와 생활 규칙, 방문객, 사생활 보호를 개별 확인할 필요가 있다.", "environment": "광역 밴쿠버는 다양한 이민자 공동체와 아시아계 문화·상업 시설을 접할 수 있는 지역이다. 겨울은 캐나다 내륙보다 온화하고 비가 잦다. 대학은 밴쿠버 도심이 아니며 두 캠퍼스 통학시간과 주거 위치가 생활비를 좌우한다.", "environmentNote": "광역권의 일반적 특성. 특정 동네의 인종 비율이나 체감 안전도를 수치화하지 않았다.", "budgetBasis": ["공식 국제학생 생활비 예시에서 등록금·입학 예치금을 제외: 숙식 CAD 5,600 + 기타 1,625 + 교재 875 + 의료 271 + 학생회비 175.85 + 교통 191.40.", "치과·확장 건강보험 276.95를 더한 CAD 9,015.20을 하한으로, 20% 상승한 10,818.24를 상한으로 계산. 일반 국제학생 예시이므로 교환학생 실청구액과 차이 가능."], "risk": "2026-2 2차에도 3명이 게시되었고 2025-2 추가 모집에 1명이 있었다. 2027-1은 1차 4명, 2차 미등재다. 미등재가 전원 충원을 입증하지는 않는다.", "mix": "GSWS 1102 + PSYC 3120 또는 3330 + 연구방법·통계 과목. 코퀴틀람/뉴웨스트민스터 이동을 고려해 학기별 시간표를 구성하는 예시다.", "coverage": "공식 부서별 전체 목록의 PSYC 56개와 GSWS 5개를 모두 수록했습니다. PSYC 5000번대 5개는 별도 전문과정으로 표시했습니다. 학기 정보는 개별 페이지에 표시된 것만 병기하며, 교환 파견학기 개설을 보장하지 않습니다. 다른 전공에 흩어진 모든 젠더 과목을 포괄하지는 않습니다.", "safety": {"text": "New Westminster와 Coquitlam 캠퍼스에는 24시간 보안 순찰이 있습니다. SaferWalk는 New Westminster SkyTrain역 및 Lafarge Lake–Douglas역까지의 동행을 제공하고, 캠퍼스 운영시간 중 주차장 동행도 요청할 수 있습니다. 공식 보안 안내는 사건 조사·기록 서비스를 설명하지만, 비교 가능한 연도별 캠퍼스 범죄 통계는 이번 확인 범위에서 찾지 못했습니다. 따라서 수치에 근거한 '낮은 범죄율' 평가는 보류합니다. 응급상황은 911에 먼저 연락한 뒤 교내 보안실에 연락합니다. New Westminster 604-527-5405, Coquitlam 604-777-6254.", "sources": [{"label": "Douglas Security·SaferWalk", "url": "https://www.douglascollege.ca/about-douglas/campus-information/safety-security-and-risk-management/security"}]}, "composition": {"text": "공식 Global Programs and Exchanges 및 국제학생 안내를 확인했지만, 입국 교환학생만을 분리한 국가별 인원·비율표는 찾지 못했습니다. 협정국 목록은 학생의 실제 구성과 다르므로 국적 비율의 근거로 사용하지 않습니다. 전체 국제학생 안내나 유학 홍보의 국가 수를 교환학생 구성으로 대신 표시하지 않았습니다. 실제 함께 생활할 집단의 구성은 해당 파견학기 교환 담당 부서의 집계 확인이 필요합니다.", "sources": [{"label": "Douglas Global Programs and Exchanges", "url": "https://www.douglascollege.ca/programs-and-courses/global-programs-and-exchanges"}, {"label": "Douglas 국제학생 안내", "url": "https://www.douglascollege.ca/international-students"}]}}, {"id": "newpaltz", "name": "SUNY 뉴팔츠", "en": "SUNY New Paltz", "country": "미국", "city": "뉴욕주 · 허드슨밸리", "period": "1학기", "months": 4.5, "quota": ["3", "—"], "history": ["3", "—", "—"], "score": [9, 5, 9], "tag": "퀴어 연구의 학부 과목 구성이 풍부", "world": "US News 2027 북동부 공립 공동 6위", "worldsrc": "https://sites.newpaltz.edu/news/2026/09/u-s-news-world-report-rankings-2027/", "psych": 1892, "psychsrc": "https://edurank.org/uni/state-university-of-new-york-at-new-paltz/rankings/", "budget": {"name": "SUNY New Paltz", "cur": "USD", "lo": 13250, "hi": 15900, "airlo": 150, "airhi": 230, "visa": 80, "krwLow": 2370, "krwHigh": 2880}, "courses": [{"group": "심리학", "code": "PSY093", "title": "SONA Participation Requirement", "credit": "0 미국 학점", "description": "연구참여 경험 — 간략 주제 표기입니다. 자세한 강의설명·평가·선수요건은 연결된 공식 편람에서 해당 코드를 확인하세요.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "전공/부전공 등 소속 제한", "status": "2026–27 전체 편람 · 개설 학기 미확인", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/psy/", "term": "학기별 개설 미확인"}, {"group": "심리학", "code": "PSY101", "title": "Introduction to Psychology", "credit": "3 미국 학점", "description": "심리학 분야 개관 — 간략 주제 표기입니다. 자세한 강의설명·평가·선수요건은 연결된 공식 편람에서 해당 코드를 확인하세요.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "교환학생 등록 허가 및 분반별 제한은 별도 확인", "status": "2026–27 전체 편람 · 개설 학기 미확인", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/psy/", "term": "학기별 개설 미확인"}, {"group": "심리학", te/course-descriptions/wom/", "term": "학기별 개설 미확인"}, {"group": "젠더·퀴어", "code": "WOM499", "title": "Modular Course", "credit": "0 미국 학점", "description": "모듈형 수업 — 간략 주제 표기입니다. 자세한 강의설명·평가·선수요건은 연결된 공식 편람에서 해당 코드를 확인하세요.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "신입생 수강 제한", "status": "2026–27 전체 편람 · 개설 학기 미확인", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/wom/", "term": "학기별 개설 미확인"}, {"group": "심리학", "code": "PSY 301 + 311", "title": "Research Methods + Laboratory", "credit": "3 + 1 credits", "description": "연구 설계와 실습을 연결한다.", "fit": "정체화 관심을 심리학 연구·진로와 연결.", "caution": "통계 및 심리학 전공자 제한·학년 조건 확인 필수.", "status": "2026–27 편람 · 학기 개설 미확인", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/psy/", "term": "학기별 개설 미확인"}], "sources": [{"label": "교환학생 팩트시트·비용", "url": "https://terminal.newpaltz.edu/international/partners/exchange/partner-fact-sheet/"}, {"label": "WGSS 교수진 디렉터리", "url": "https://www.newpaltz.edu/wmnstudies/directory.html"}, {"label": "LGBTQ+ 주거 안내", "url": "https://www.newpaltz.edu/lgbtq/housing.html"}, {"label": "2026–27 Psychology 전체 편람 (44)", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/psy/"}, {"label": "2026–27 Women’s, Gender & Sexuality 전체 편람 (39)", "url": "https://catalog.newpaltz.edu/undergraduate/course-descriptions/wom/"}], "intro": "뉴욕주립대 체계의 지역대학. 허드슨밸리의 대학도시 환경과 학부 중심 교육을 기대할 수 있다. 뉴욕시 도심 캠퍼스는 아니다.", "department": "Psychology와 Women’s, Gender & Sexuality Studies 전공·부전공이 있다. Queer Experience, Queer Studies, Queer Women을 구분해 제공하는 점이 이번 비교의 강점이다.", "faculty": "WGSS 공식 교수진 페이지가 통합 디렉터리로 연결된다. 이번 확인에서는 파견 학기 담당 교수·연구 지도 가능 인원을 확정하지 못했다. 교수 이름을 임의로 추천하지 않고 과목 구성을 중심으로 평가했다.", "career": "퀴어 이론·여성주의 방법론과 사회심리학을 함께 공부하고 싶은 경우 적합하다. 정체성의 명명과 삶의 경험을 읽는 인문사회 관점에 강점이 있다.", "registration": "WOM 330·315에는 1학년 수강 제한이 있다. PSY 301/311은 통계·전공자 제한 때문에 일반 교환학생에게 자동 개방되는 연구방법 수업으로 볼 수 없다. WOM 321도 입문·이론 과목 요건이 있다.", "housing": "2026 가을 교환학생 공식 예상액은 방 USD 6,230, 식사 3,050이다. Gender-inclusive housing과 Rivera House 안내가 있으나 특정 주거 형태나 동반 배정은 보장되지 않는다.", "support": "국제처 교환학생 팩트시트에 입학·보험·오리엔테이션과 예상 비용이 정리되어 있다. 의무 건강보험과 교내 건강센터 비용을 별도로 계산해야 한다.", "gender": "대학 LGBTQ+ 안내와 gender-inclusive housing이 확인된다. 캠퍼스 지원 제도와 개인의 생활 경험은 별개이며, 방 배정·이름 표기·신고 절차는 실제 입학 후 적용 조건을 확인해야 한다.", "environment": "허드슨밸리의 소도시·예술·야외활동 환경이다. 뉴욕시 방문에는 별도 이동비와 시간이 든다. 사계절이 뚜렷하고 겨울에는 추위·눈에 대비해야 한다. 대도시 전체의 인종 구성을 이 캠퍼스 주변에 그대로 적용하지 않았다.", "environmentNote": "주변 인종 구성의 최신 정량 자료는 미확인. 지역대학 생활과 뉴욕시 생활을 구분한 안내다.", "budgetBasis": ["2026 가을 공식 항목(USD): 방 6,230 + 식사 3,050 + college fee 30 + 건강센터 170 + 보험 1,060 + 교재 680 + 개인경비 1,880 + 오리엔테이션 150 = 13,250.", "현지 지출 상한은 위 금액의 20% 증가인 USD 15,900. 미국 후보 중 현금 부담이 높은 편이다."], "risk": "2027-1·2026-2 모두 1차 3명, 이후 차수 미등재. 신청자 수·최저 선발점수·실제 충원 결과는 공개자료에서 확인되지 않았다.", "mix": "WOM 222 또는 330 + PSY 221 + WOM 315/220 + 허용되는 방법론 과목. 이론 과목의 읽기·영문 에세이 부담을 함께 검토하는 예시다.", "coverage": "2026–27 학부 공식 편람 PSY 44개·WOM 39개, 두 접두어의 전체 83개를 수록. 다른 학과 교차개설 과목 전체와 학기별 실제 시간표는 미수집. 과목명·학점·수강제한 및 짧은 주제 안내를 제공하며 상세 설명 원문은 공식 링크로 연결합니다.", "safety": {"text": "공식 안전보고서 목록에서 확인한 최신 공개 항목은 2025 Annual Security & Fire Safety Report이며 2024년 범죄통계를 포함합니다. 연결 보고서 본문 접근이 실패해 범죄 종류별 수치와 정확한 지리적 집계범위는 재검증하지 못했습니다. 따라서 수치나 안전 순위는 제시하지 않습니다. 공식 목록의 새 보고서와 대학경찰 경보를 함께 확인해야 합니다.", "sources": [{"label": "공식 Annual Security and Fire Safety Reports 목록", "url": "https://www.newpaltz.edu/police/clery-compliance/annual-security-and-fire-safety-reports/"}]}, "composition": {"text": "방문 교환학생만의 국적·지역별 인원표는 확인하지 못했습니다. 학교의 교환학생 안내에 나오는 국제학생·학자 600명/50여 국가 문구는 교환학생 전용 통계가 아니므로 교환학생 구성으로 사용하지 않았습니다.", "sources": [{"label": "공식 Prospective Exchange Students 안내", "url": "https://www.newpaltz.edu/iss/newly-admitted-students/prospective-exchange-students/"}]}}, {"id": "adelaide", "name": "애들레이드 대학교", "en": "Adelaide University", "country": "호주", "city": "애들레이드 · 복수 캠퍼스", "period": "2학기 · 1년", "months": 12, "quota": ["2", "2"], "history": ["4 (1학기)", "—", "—"], "score": [9, 8.5, 8.5], "tag": "젠더 2026/soci-2204/", "term": "2026 Semester 2"}, {"group": "젠더·퀴어", "code": "SOCI1033", "title": "Introduction to Gender Studies", "credit": "6 units", "description": "젠더 연구 입문 과목.", "fit": "내용은 관련되지만 현재 교환 수강안에서는 제외.", "caution": "2026 inbound No. 전공에 있다고 신청 가능한 것은 아님.", "status": "2026 inbound No", "url": "https://adelaide.edu.au/study/courses/2026/soci-1033/", "term": "학기별 개설 미확인"}], "sources": [{"label": "젠더·섹슈얼리티 전공", "url": "https://adelaide.edu.au/study/degrees/bachelor-of-arts-gender-and-sexuality-studies/"}, {"label": "교환학생 비용", "url": "https://adelaide.edu.au/study/global-learning/study-abroad-and-exchange/study-abroad-and-exchange-costs-and-fees/"}, {"label": "도시 생활비", "url": "https://studyadelaide.com/life/cost-of-living"}, {"label": "LGBTQIA+ 지원", "url": "https://adelaide.edu.au/students/student-services/lgbtqia-support-and-community/"}, {"label": "심리학 학사 전체 학업계획", "url": "https://adelaide.edu.au/study/degrees/bachelor-of-psychology/"}, {"label": "젠더·섹슈얼리티 전공 전체 학업계획", "url": "https://adelaide.edu.au/study/degrees/bachelor-of-arts-gender-and-sexuality-studies/"}, {"label": "Incoming exchange SSAF 면제", "url": "https://adelaide.edu.au/students/student-services/finances/student-services-and-amenities-fees-ssaf/"}], "intro": "2026년 통합 출범한 Adelaide University. 기존 University of Adelaide와 University of South Australia의 옛 과목·순위를 새 대학에 그대로 붙이지 않았다. 현재 단국대 모집 기간은 1년이다.", "department": "심리학 과정과 BA의 Gender and Sexuality Studies 전공이 있다. 신체·젠더·섹슈얼리티를 사회학적으로 읽는 수업에서 교환학생 수강 가능 여부가 명시되어 있어 검토 근거가 비교적 선명하다.", "faculty": "SOCI 2204 코디네이터는 Katrina Jaworski, SOCI 1202는 Megan Warin으로 2026 과목 페이지에 표시된다. 이들은 젠더·사회문화 영역의 연결점이며, 심리학 실험실 참여를 뜻하지 않는다.", "career": "정체화·신체·사회적 규범의 관계, 젠더 폭력·정의, 질적 연구 접근을 장기간 탐색하기 좋다. 1년이면 선수과목을 먼저 듣고 후속 과목으로 이어갈 여지가 있으나 2027 시간표가 필요하다.", "registration": "2026 과목 페이지의 Available for inbound students 항목을 기준으로 판단했다. SOCI 2204·1202는 Yes지만 SOCI 1033은 No였다. 전공 전체가 교환학생에게 개방된다는 뜻은 아니다. East/Magill 등 캠퍼스 이동도 확인해야 한다.", "housing": "교내·제휴 학생 주거와 민간 임대를 비교해야 한다. 예산은 StudyAdelaide의 도시 생활비 범위를 사용했으며 특정 기숙사 방의 견적이 아니다. 방학을 포함한 52주 체류로 계산했다.", "support": "새 대학의 Global Learning에서 Study Abroad & Exchange 절차와 비용을 안내한다. 통합 후 포털·캠퍼스·수업 코드가 바뀔 수 있으므로 입학허가서 기준을 따른다.", "gender": "공식 LGBTQIA+ support and community 안내가 있다. 통합 전 대학의 서비스 명칭·위치를 현재 체계와 대조할 필요가 있다.", "environment": "남호주 주도이며 도심과 교외 캠퍼스가 나뉜다. 여름은 덥고 건조하고 겨울은 비교적 온화하며 비가 늘어나는 기후다. 한국과 계절이 반대라 7월 시작도 겨울 준비가 필요하다. 국제학생·이민자 문화권이 공존한다.", "environmentNote": "도시의 일반적 생활 조건. 캠퍼스별 인종 구성이나 개인별 안전을 추정하지 않았다.", "budgetBasis": ["StudyAdelaide의 주당 AUD 350–700 × 52주 = 18,200–36,400. 이는 주거·일상 생활의 넓은 범위이며 최저액에 원하는 방을 구할 수 있다는 보장은 없다.", "추정 추가액: 교재 1,000 + OSHC 1,000 + 초기 정착비 400 = AUD 2,400. 현지 총액 AUD 20,600–38,800. 현행 공식 안내에서 Incoming exchange는 SSAF 면제이므로 학생비 400은 제외했다."], "risk": "2027-1은 1·2차 모두 1년 2명. 2026-2 1차의 4명은 1학기 조건이라 기간이 다른 과거 모집과 단순 경쟁률 비교가 불가능하다.", "mix": "2026 기준 S1의 PSYC 1001과 S2의 SOCI 2204·1202를 이어 보는 1년 구성. 이는 2027 개설 보장이 아닌 현재 확인된 계절별 배치 예시다.", "coverage": "2026-09-26 공식 학위 페이지의 심리학 학사 전공 필수 14개·실습 1개, 젠더·섹슈얼리티 전공 필수 8개와 해당 학위 실습 3개 전부 수록. SOCI2204 추가. 대학 전체 PSYC/SOCI 편람 전체는 아니며, 공통교양·제2전공·자유선택 전체는 제외. 학기는 학위 표준 학업계획상의 권장 시점으로, 실제 교환 학기의 개설 확정과 다름. 과목 설명은 제목 기반 주제 안내와 기존 개별 편람 확인 내용을 구분함.", "safety": {"text": "Adelaide University의 현행 보안팀은 전 캠퍼스를 24시간·주 7일 순찰하고 응급 대응·응급처치를 제공합니다. 캠퍼스 보안전화와 AU Security Services(현지 8302 5444 또는 1800 500 911)로 도움이나 사건을 신고할 수 있습니다. 폭력·위협·절도·사고 등을 접수하며, 신고 과정의 상담 지원과 성폭력 피해 외부 지원기관도 안내합니다. 긴급 경찰·구급·소방은 000입니다. 통합대학 현행 페이지에서 야간 동행의 구체적 운영범위는 확인하지 못했으므로 이전 대학의 2025년 서비스를 그대로 보장하지 않습니다. 지역 치안은 SAPOL의 suburb/우편번호별 범죄지도에서 주소별로 확인할 수 있습니다. 2026년 7월까지의 주 단위 자료가 게시돼 있으며, suburb 자료는 개인정보 때문에 성범죄를 제외합니다. 이번 조사에서는 숙소별 동일 기간 범죄율 비교를 수행하지 않아 안전 순위를 매기지 않았습니다.", "sources": [{"label": "Adelaide University 현행 보안·신고 안내", "url": "https://adelaide.edu.au/life-at-adelaide/campus-services/security/"}, {"label": "South Australia Police 범죄지도·통계", "url": "https://www.police.sa.gov.au/about-us/crime-statistics-map"}]}, "composition": {"text": "확인한 공식 유입 교환·Study Abroad 안 정이 모두 그대로 유지된다고 볼 수 없다. 심리학은 BA/BS·부전공·Pre-Counseling 인증과정을 안내합니다. 심리학 부전공은 최소 24학점(PSY 201·202 및 선택 16학점, 그중 상급 12학점). Pre-Counseling 인증 수여에는 SOU 학사 졸업자 또는 이미 학사학위 소지자라는 조건이 있어 한 쿼터 교환만으로 인증 취득을 전제하면 안 됩니다. GSWS 부전공은 24학점: 입문, Feminist and Queer Theory in Action, 선택 4과목. GSWS 인증은 28학점: 입문·이론실천·Explorations 또는 Intersectionality의 핵심과 선택 4과목. Transgender Studies 인증은 핵심+선택 구조, 수업은 2년 주기로 순환하며 한 쿼터에 전체를 들을 수 없습니다. EDI micro-credential 필수 4과목은 NAS 201·GSWS 201·NAS 301·GSWS 300이며 모두 C- 이상이 요구됩니다. 2026 조직개편 이후 유지 범위와 교환학생 등록 자격은 실제 파견 시점 확인 대상입니다.", "faculty": "공식 GSWS 교수진에 Kylan de Vries와 Carey Jean Sojka가 소개된다. 특히 트랜스·퀴어 정체성 및 질적 접근과의 연결을 검토할 수 있다. 구조조정 이후 강의 배정·지도 가능성은 별도 확인해야 한다.", "career": "퀴어·트랜스 삶과 공동체에 집중하는 짧은 탐색 경험에 잘 맞을 수 있다. 다만 핵심 과목이 해당 쿼터에 없으면 이 장점이 크게 줄어드는 조건부 후보다.", "registration": "GSWS 관련 안내에는 2년 주기 개설이 언급되어 있다. 아래 과목 코드는 2023 공식 교과 자료를 기반으로 하므로, 2027 특정 쿼터 수강 확정안으로 사용하면 안 된다. 쿼터 학점의 단국대 환산도 별도 확인한다.", "housing": "2026–27 대학 연간 숙식비를 3개 쿼터로 나누어 계산했다. 이는 특정 방의 1쿼터 계약 견적이 아니며, 방학·조기 입주·식사 미제공 기간 비용을 추가 확인해야 한다.", "support": "Office of International Programs가 교환·입학 및 의무 의료보험을 안내한다. 단기 체류에서는 도착 직후 오리엔테이션과 수강 변경 일정이 특히 중요하다.", "gender": "Gender and Sexuality Justice의 트랜스 자원 안내에서 교내외 지원 연결을 제공한다. 학문 과정의 유지 여부와 학생 지원 서비스는 별개로 확인해야 한다.", "environment": "포틀랜드와 떨어진 남부 오리건의 소도시다. 대도시 수준의 대중교통·다양한 상업시설을 기대하기보다는 캠퍼스·지역 공동체 중심의 생활이 된다. 여름은 건조하고 겨울은 서늘하며, 산불 연기가 영향을 주는 시기에는 현지 대기질 공지를 확인할 필요가 있다.", "environmentNote": "지역의 일반적 특성. 캠퍼스 주변 인종 구성과 파견 시기 대기질은 미확인.", "budgetBasis": ["2026–27 연간 숙식 USD 18,137 + 학생비 2,675.25를 3쿼터로 나누면 쿼터당 약 6,937.42.", "추정 추가액: 교재 300–600 + 개인·교통 1,200–1,800 + 보험 500–900. 현지 총액 USD 8,937.42–10,237.42."], "risk": "2027-1 3→2명, 2026-2 2·3차 각각 2명 게시. 반복 추가 모집의 신호는 있으나 실제 미달 인원·지원자 수는 확인되지 않았다.", "mix": "해당 쿼터에 열리는 GSWS 341/342 중 하나 + PSY 369 또는 492 + 일반 심리학 과목. 핵심 과목 개설을 확인한 뒤 후보 순위를 결정할 필요가 있다.", "coverage": "공식 편람 홈 표기는 2025–26이며 PSY/GSWS 전체 과목 색인과 프로그램 편람 본문 접근이 제한되어 전체 학과 편람은 미수집입니다. 대신 정상 열람되는 학과 프로그램 구조, Pre-Alcohol and Drug Counseling 안내에 열거된 전체 9개 선택지, EDI micro-credential 전체 4개 필수과목을 추가했습니다. 이 13개는 학과 전체 과목의 일부이고 개설 학기는 미확인입니다.", "safety": {"text": "2025 Annual Security & Fire Safety Report의 2024년 Ashland Campus, On Campus Total 기준: 강간(Rape) 3건, 가중폭행 3건, 침입절도 4건, 차량절도 3건. Ashland 캠퍼스 통계와 Medford Higher Education Center는 별도로 실려 있습니다. 주거시설과 기타 교내를 합친 총계이며 도시 전체 범죄율이 아닙니다. 본문 일부 머리말에 2024 보고서 표기가 남아 있지만 표지의 발행연도는 2025, 통계연도는 2024로 확인했습니다. 적은 신고 건수만으로 안전이나 무신고 피해가 없음을 판단할 수 없습니다.", "sources": [{"label": "2025 ASR · 2024 Ashland 범죄통계, 인쇄 15쪽", "url": "https://cps.sou.edu/wp-content/uploads/sites/77/2025/10/Annual-Security-and-Fire-Safety-Report-2025_FINAL_1.pdf"}]}, "composition": {"text": "2026년 1월 이사회 공식자료(69쪽)는 2025년 가을 교환학생 6명이 4개 협정교에서 왔다고 보고합니다. 출신 협정교는 프랑스 Lille, 한국 단국대·전남대, 일본 Tokyo International University입니다. 이는 교환학생의 출신 대학·국가 분포이며 개인 국적이나 인종 통계가 아닙니다. 국가별 인원은 공개된 문구로 분리할 수 없습니다. 같은 페이지의 전체 국제학생 28명·15개 국가는 교환학생 6명의 구성과 구별해야 합니다.", "sources": [{"label": "2026-01 이사회 자료 · Fall 2025 International Programs, 69쪽", "url": "https://governance.sou.edu/wp-content/uploads/sites/63/2026/01/011526-Meeting-Materials_v2.pdf"}]}}, {"id": "cpp", "name": "칼폴리 포모나", "en": "Cal Poly Pomona", "country": "미국", "city": "캘리포니아 · 포모나", "period": "1학기", "months": 4, "quota": ["3", "2"], "history": ["2", "1", "—"], "score": [7, 6, 8.5], "tag": "응용심리·정체성 · 온라인 수업 제약", "world": "US News 2026 서부 공립 2위", "worldsrc": "https://www.cpp.edu/class/psychology/index.shtml", "psych": 1663, "psychsrc": "https://edurank.org/uni/california-state-polytechnic-university-pomona/rankings/", "budget": {"name": "CPP", "cur": "USD", "lo": 10650, "hi": 12780, "airlo": 150, "airhi": 230, "visa": 80, "krwLow": 1950, "krwHigh": 2380}, "courses": [{"group": "심리학", "code": "PSY 2204", "title": "Research Methods", "credit": "3 credits", "description": "심리학 연구 설계의 기본 방법을 다룬다.", "fit": "정체성·다문화·응용심리 진로와 연결.", "caution": "공개 시간표 기준: 대면 MW 10:00–11:15. PSY 3321과 충돌. 선수요건과 교환 수강 허가 별도.", "status": "2027 봄 시간표 확인 · 변경 가능", "url": "https://schedule.cpp.ed  "공식 GE 과목 목록에서 확인. 파견 학기 시간표·상위과목 요건은 미확인.", "status": "과목 목록 확인", "url": "https://www.cpp.edu/studentsuccess/guides/ge.shtml", "term": "학기별 개설 미확인"}, {"group": "젠더·퀴어", "code": "EWS 4250", "title": "Gender, Identity and Technology", "credit": "3 credits", "description": "젠더·정체성과 기술의 관계를 검토하는 과목.", "fit": "정체화·디지털 자기표현의 사회문화 맥락에 관심이 있을 때 검토.", "caution": "공식 GE 과목 목록에서 확인. 파견 학기 시간표·상위과목 요건은 미확인.", "status": "과목 목록 확인", "url": "https://www.cpp.edu/studentsuccess/guides/ge.shtml", "term": "학기별 개설 미확인"}], "sources": [{"label": "GEMS 학과", "url": "https://www.cpp.edu/class/ethnic-womens-studies/index.shtml"}, {"label": "심리학과", "url": "https://www.cpp.edu/class/psychology/index.shtml"}, {"label": "교환학생 및 비용", "url": "https://www.cpp.edu/international/study-abroad/students/incoming-exchange-students.shtml"}, {"label": "트랜스 지원", "url": "https://www.cpp.edu/tree/pride/resources/transgender-resources.shtml"}, {"label": "2026 학부 연구 사례", "url": "https://www.cpp.edu/mcnair/docs/mcnair-symposium/programs/symposium-program-2026.pdf"}, {"label": "2026–27 대학 편람", "url": "https://catalog.cpp.edu/"}, {"label": "공식 전체 과목 색인 (자동 수집 접근 불가)", "url": "https://catalog.cpp.edu/content.php?catoid=78&navoid=7093"}, {"label": "학기별 실제 강의시간표", "url": "https://schedule.cpp.edu/"}, {"label": "2026–27 전공별 교육과정·2년/4년 로드맵 전체 목록", "url": "https://www.cpp.edu/academic-programs/academic-advising/tools/sheets-roadmaps/2026-2027/index.shtml"}, {"label": "2026–27 Psychology BA 공식 교육과정 (본문 접근 제한)", "url": "https://catalog.cpp.edu/preview_program.php?catoid=78&poid=24244&print="}, {"label": "2026–27 GEMS BA 공식 교육과정 (본문 접근 제한)", "url": "https://catalog.cpp.edu/preview_program.php?catoid=78&poid=24168&print="}, {"label": "GEMS 학위·부전공 전체 구조", "url": "https://www.cpp.edu/class/ethnic-womens-studies/programs/gems-major.shtml"}], "intro": "캘리포니아 주립대 체계의 공립 폴리테크닉 대학. 실용·응용 교육의 성격이 강하다. Cal Poly San Luis Obispo나 사립 Pomona College와는 다른 학교다.", "department": "Psychology와 Gender, Ethnicity and Multicultural Studies(GEMS), Gender and Sexuality 부전공을 검토할 수 있다. 정체성·다문화·상담·프로그램 평가 수업의 조합이 특징이다. 2026–27 공식 로드맵 목록상 Psychology BA 120학점, GEMS BA 일반 및 Pre-Credential 각 120학점이 있습니다. GEMS 학과가 나열한 부전공 6개는 Asian/Pacific Islander American Studies, Chicana/o and Latina/o Studies, Gender and Sexualities Studies, Native American Studies, Multicultural Leadership Studies, African American Studies입니다. BA 학위의 세부 교과 구조와 각 부전공의 전체 과목 목록은 편람 본문 접근이 필요합니다. 4년 이수계획의 가을·봄 배치는 교환 시점 실제 개설 보장이 아닙니다.", "faculty": "Tatiana Basanez와 관련된 2026 McNair 학생 연구 사례에서 정체성 통합·종교성·웰빙 주제가 확인된다. 학부 연구의 사례이며 교환학생을 위한 연구 자리 공고는 아니다.", "career": "상담·지역사회 프로그램 평가·다문화심리 관점을 탐색하기 좋다. 다만 현재 확인한 봄학기 심리학 수업 상당수가 온라인이어서 실제 해외 수업 경험과 체류 규정에 맞는 조합인지 확인이 필요하다.", "registration": "2027 봄 공개 시간표 기준으로 PSY 2204와 3321, 3325와 4170이 각각 시간 충돌한다. PSY 4430A와 4455도 겹친다. 수강 허가 번호가 시간 충돌을 자동 해소하지 않는다. 교환학생의 온라인 과목 인정·허용량은 국제처 확인 사항이다.", "housing": "공식 교환 예상액의 숙식 USD 6,000을 사용했다. 실제 기숙사·식사 계약 유형과 4개월 청구액, 조기 입주 비용은 따로 확인해야 한다.", "support": "International Center의 Incoming Exchange Students 안내를 통해 추천·지원·수강·비용을 확인한다. 학생비 중 교환 면제 항목이 있는지는 최종 청구서 기준이다.", "gender": "Pride Center가 이름·성별 관련 자원과 gender-inclusive housing 연결을 제공한다. 공식 트랜스 안내상 교내에서 HRT를 직접 제공하지 않는 점도 구분할 필요가 있다.", "environment": "로스앤젤레스 카운티 동쪽의 도시·통학형 캠퍼스다. 남부 캘리포니아의 다양한 이민자 문화권을 접할 수 있지만 LA 도심과는 거리가 있다. 여름은 덥고 건조하고 겨울은 비교적 온화하다. 교외 활동과 이동수단에 따라 교통비가 크게 달라진다.", "environmentNote": "지역의 인종 구성 비율은 미확인. 자동차 구매·장기 렌트 비용은 기본 예산에서 제외.", "budgetBasis": ["공식 교환 예상액(USD): 학생비 850 + 교재 450 + 숙식 6,000 + 개인비 2,000 + 교통 700 = 10,000.", "보험 650을 추정 추가해 10,650, 상한은 20% 증가한 12,780. 학생비 면제 가능액은 확인 전까지 차감하지 않았다."], "risk": "2027-1 3→2명, 2026-2 2→1명 게시. 추가 모집 이력은 있지만 학교별 선발점수·경쟁률은 확인되지 않았다.", "mix": "PSY 2204 + 3325 또는 4170 + EWS 젠더 과목 + 시간 충돌 없는 대면 과목. 온라인 비중과 EWS 실제 개설을 확인한 후에야 성립하는 조합이다.", "coverage": "2026–27 공식 편람 및 해당 연도 심리학·GEMS 교육과정 링크까지 확인했으나 과목·프로그램 본문이 접근 제한을 반환하여 현행 PSY/EWS 전체 목록은 미수집입니다. 공개 대체 자료도 재확인했으나 학과 과거 PDF 링크들이 현재 404여서 현행 전체편람으로 전용하지 않았습니다. 아래 확인 과목은 일부이고, 별도로 현행 학위·부전공 전체 구조와 공식 로드맵을 연결합니다.", "safety": {"text": "2026 Annual Security Report의 2025년 Campus Total 기준: 강도 1건, 가중폭행 0건, 침입절도 18건, 차량절도 64건, 스토킹 5건. 차량절도 64건 중 57건은 전동 킥보드·전기자전거 관련이므로 자동차 64대 도난으로 읽으면 안 됩니다. 2025년 교내 혐오범죄는 민족성(ethnicity) 편견에 의한 위협 1건으로 보고됐습니다. Clery 집계는 정의된 대학 관할구역의 보고 건수이며 Pomona 도시 전체의 범죄율 또는 개인 피해확률이 아닙니다. 기숙사 열은 Campus Total의 부분집합으로 합산하면 중복됩니다.", "sources": [{"label": "2026 공식 안전보고서 안내", "url": "https://www.cpp.edu/annual-security-report.shtml"}, {"label": "2026 ASR · 2023–25 범죄통계, PDF 9–11쪽", "url": "https://www.cpp.edu/pdfs/annual_security_report.pdf"}]}, "composition": {"text": "방문 교환학생만의 최근 국적·지역별 인원표는 이번 공개자료 조사에서 확인하지 못했습니다. 전체 국제학생 수나 전체 학생의 인종 구성으로 교환학생 구성을 대체하지 않았습니다. 파트너 대학의 소재국 역시 개인 국적과 동일하지 않습니다.", "sources": [{"label": "공식 Incoming Exchange 안내", "url": "https://www.cpp.edu/international/study-abroad/students/incoming-exchange-students.shtml"}]}}, {"id": "galway", "name": "골웨이 대학교", "en": "University of Galway", "country": "아일랜드", "city": "골웨이 · 서부 해안", "period": "1학기", "months": 5, "quota": ["2", "2"], "history": ["1", "1", "1"], "score": [7.5, 8, 8], "tag": "방문학생 심리학 과목 안내가 명확", "world": "QS 2027 275위", "worldsrc": "https://www.topuniversities.com/universities/university-galway", "psych": 541, "psychsrc": "https://edurank.org/uni/national-university-of-ireland-galway/rankings/", "budget": {"name": "Galway", "cur": "EUR", "lo": 6325, "hi": 9725, "airlo": 170, "airhi": 250, "visa": 70, "krwLow": 1410, "krwHigh": 2120}, "courses": [{"group": "심리학", "code": "PS214", "title": "Developmental Psychology 1", "credit": "5 ECTS", "description": "유아 인지·사회정서·도덕·젠더 발달.", "fit": "발달·자기·사회적 맥락에 대한 연구 질문과 연결.", "caution": "2시간 기말시험. 담당 Mairead Foody.", "status": "2026/27 방문학생 공식 편람", "url": "https://www.universityofgalway.ie/media/schoolofpsychology/visitingstudents/S1-Visiting-Student-Modules-2627.pdf", "term": "2026/27 Semester 1"}, {"group": "심리학", "code": "PS219", "title": "연구방법", "credit": "편람 미표기·확인 필요", "description": "측정·설계·기초 통계·SPSS·APA 보고.", "fit": "발달·자기·사회적 맥락에 대한 연구 .ie/global-galway/studyinireland/yourcountry/prospectusandguides/Pre-Arrival-Guide-2024_2025_FINAL.pdf"}, {"label": "2026 입국 안내", "url": "https://www.universityofgalway.ie/global-galway/downloads/Pre-ArrivalGuide2026_v1.pdf"}, {"label": "주거 안내", "url": "https://www.universityofgalway.ie/student-life/accommodation/"}, {"label": "학생회 LGBTQ+ 자원", "url": "https://su.universityofgalway.ie/campaigns/lgbt/"}, {"label": "2026/27 Semester1 방문학생 전체 심리학 편람", "url": "https://www.universityofgalway.ie/media/schoolofpsychology/visitingstudents/S1-Visiting-Student-Modules-2627.pdf"}, {"label": "방문학생 공식 학과 안내", "url": "https://www.universityofgalway.ie/colleges-and-schools/arts-social-sciences-and-celtic-studies/psychology/visiting-students/"}], "intro": "아일랜드 서부 해안의 연구대학. 도시·대학·아일랜드 문화가 가까이 연결되어 있다. 영어 강의를 듣더라도 아일랜드어와 지역 문화의 존재를 함께 경험하는 환경이다.", "department": "School of Psychology의 방문학생용 과목 목록이 따로 있어 수강 검토가 비교적 쉽다. Women’s Studies의 대학원 과정은 확인되지만, 이를 학부 교환학생의 젠더 전공 선택지로 계산하지 않았다.", "faculty": "Chris Noone의 LGBT 웰빙·공동체 관련 연구가 관심 주제와 연결된다. 방문학생 목록에서 Michael Hogan, 건강심리학의 Oonagh Meade 등 교수진도 확인된다. 지도·실험실 참여는 별도 승인이 필요하다.", "career": "건강·사회·발달심리학, 심리학의 사회적 가치와 맥락행동과학을 탐색할 수 있다. 퀴어 전용 학부 과목의 양은 New Paltz·Manitoba보다 현재 확인 근거가 적다.", "registration": "일반 학위과정 전체가 아닌 Visiting Student Modules에서 선택해야 한다. PS214는 15 ECTS여서 한 과목의 부담이 크다. 실험·워크숍 과목에는 정원 제한이 있을 수 있으며 가을 목록과 봄 목록을 섞어 시간표로 만들면 안 된다.", "housing": "공식 주거 안내상 교내 기숙사는 제한적이며 배정 보장이 없다. 교외 주거를 확보하지 못하면 예산 상단을 넘길 수 있다. 2024–25의 숫자 자료를 사용한 예산이라 주거 견적 갱신이 특히 중요하다.", "support": "Study Abroad 담당 부서와 방문학생 핸드북에서 등록·과목 선택을 안내한다. 심리학 방문학생 담당자와 수강 가능 목록을 대조할 수 있다.", "gender": "학생회 LGBTQ+ 캠페인·지원 연결 경로가 확인된다. 학내 지원 존재와 학부 퀴어 과목의 개설 여부를 분리해 평가했다.", "environment": "대서양 연안으로 비와 바람이 잦고, 여름에도 선선할 수 있다. 대학도시와 문화·공연 활동이 특징이며, 주택 공급이 빠듯한 점이 생활의 주요 변수다. 지역 인종 구성의 최신 수치는 이번 조사에서 확보하지 못했다.", "environmentNote": "2026 입국 안내와 대학 주거 정보를 함께 참고. 체감 차별이나 안전도를 민족 구성으로 추정하지 않았다.", "budgetBasis": ["2024–25 공식 입국 안내의 월별 항목: 임대 EUR 550–860, 식비 300–400, 교재 75, 공과금 80–150, 세탁 50, 여가 100–300 = 1,155–1,835.", "교통 월 50을 추정 추가하고 5개월, 보험 300을 추가해 EUR 6,325–9,725. 최신 임대 견적이 아닌 과거 공시 기반 범위다."], "risk": "2027-1은 2→2명으로 동반 지원 조건을 충족하는 모집 이력이 있다. 2026-2 세 차수의 1명은 두 사람 동반 지원의 근거로 쓰지 않았다.", "mix": "가을 PS214 + PS322 + PS336 또는 PS3106처럼 방문학생 목록 안에서 구성. 특정 젠더 대학원 과목은 기본 수강안에 넣지 않는다.", "coverage": "2026/27 Semester 1 방문학생 심리학 편람의 14개 전부 수록. PS214는5ECTS이며 PS408 Human Sexuality 포함. PS1103은 연간 이수 전용. PS219·PS1103은 문서에서 학점 미표기. 현재 Semester2 전체 편람은 확보하지 못했고 과거 링크가404이므로 1학기 목록으로 대체하지 않음. 독립 학부 젠더 전공 편람 전체도 미확보.", "safety": {"text": "SafeZone은 교내 응급·비응급 구조요청, 야간 혼자 공부할 때의 체크인·시간제 체크인과 사건 알림을 제공합니다. 앱에서 괴롭힘·혐오범죄·성폭력 등을 신고할 수 있고 일부 신고는 익명 제출이 가능합니다. 생명이 위급하면 보안팀 연락을 기다리지 말고 112에 연락하라는 공식 지침이 있습니다. 이용은 선택이며 위치는 체크인 또는 알림을 활성화할 때 공유됩니다. 비교 가능한 연도별 캠퍼스 범죄 통계는 이번 확인 범위에서 확보하지 못했으며, 대학의 안전 홍보 문구를 개인 안전 보장으로 해석하지 않습니다.", "sources": [{"label": "Galway SafeZone 기능·개인정보 FAQ", "url": "https://www.universityofgalway.ie/buildings/safezone/"}, {"label": "Galway Safe Campus", "url": "https://www.universityofgalway.ie/safecampus/"}]}, "composition": {"text": "학교 전체 입국 교환학생을 대상으로 한 국가별 인원·비율표는 확인하지 못했습니다. 고고학과 방문학생 안내는 해당 학과 방문학생 중 미국 출신이 가장 많다고 설명하지만, 고고학 방문학생에 한정된 안내이며 심리학 또는 전체 교환학생 구성으로 일반화하지 않습니다. 공식 EDI 자료에는 전체 학생의 해외 거주지 기준 22%·126개국이라고 나와 있으나, 이는 교환학생 통계도 인종 통계도 아닙니다. 실제 파견학기와 수강 학과의 구성은 추가 확인 대상입니다.", "sources": [{"label": "고고학과 International Visiting & Erasmus Students", "url": "https://ugal.ie/colleges-and-schools/arts-social-sciences-and-celtic-studies/geography-archaeology-irish-studies/disciplines/archaeology/visiting-students/"}, {"label": "학교 전체 EDI Facts and Figures·거주지 기준", "url": "https://www.universityofgalway.ie/equalityanddiversity/data/factsfigures/"}]}}, {"id": "newcastle", "name": "뉴캐슬 대학교", "en": "University of Newcastle, Australia", "country": "호주", "city": "뉴사우스웨일스 · 뉴캐슬", "period": "1학기", "months": 5, "quota": ["2", "2"], "history": ["2", "2", "2"], "score": [7, 8, 8], "tag": "반복 추가 모집 · 사회심리와 젠더 부전공", "world": "QS 2027 244위", "worldsrc": "https:// oup": "심리학", "code": "PSYC2600", "title": "Personality and Social Psychology", "credit": "10 units", "description": "성격 이론, 태도 변화, 자기, 사회적 영향과 집단 과정을 다룬다.", "fit": "자기개념과 사회적 정체성을 함께 탐구하는 후보.", "caution": "PSYC 1010·1020 수준 배경지식 전제. 2025 편람 기준, 2027 개설 확인.", "status": "2025 편람 확인", "url": "https://handbook.newcastle.edu.au/course/2025/PSYC2600", "term": "학기별 개설 미확인"}], "sources": [{"label": "Gender and Sexuality 부전공", "url": "https://handbook.newcastle.edu.au/aos/2025/min0026"}, {"label": "심리학 학위과정", "url": "https://www.newcastle.edu.au/degrees/bachelor-of-psychological-science"}, {"label": "알고리즘과 아우팅 연구", "url": "https://www.newcastle.edu.au/news/2026/07/outed-by-the-algorithm"}, {"label": "교환학생 안내", "url": "https://www.newcastle.edu.au/study/international/study-with-us/study-abroad-and-exchange"}, {"label": "2026 비용 안내", "url": "https://www.newcastle.edu.au/__data/assets/pdf_file/0003/1082631/CIE_2026_Prospectus_DIGITAL_FA_V2_JUN_2026.pdf"}, {"label": "재정·생활비", "url": "https://www.newcastle.edu.au/study/international/before-you-leave/finances"}, {"label": "주거", "url": "https://www.newcastle.edu.au/campus-life/accommodation"}, {"label": "젠더·섹슈얼리티 지원", "url": "https://www.newcastle.edu.au/current-students/support/personal/gender-and-sexuality-support"}, {"label": "공식 심리학 과정·현재 과목 목록", "url": "https://www.newcastle.edu.au/degrees/bachelor-of-psychological-science-advanced"}, {"label": "법학 복수학위 심리학 필수 목록", "url": "https://www.newcastle.edu.au/degrees/bachelor-of-psychological-science-laws-honours"}, {"label": "2026 심리학 전체 핸드북", "url": "https://handbook.newcastle.edu.au/program/2026/40099"}, {"label": "젠더 부전공 핸드북", "url": "https://handbook.newcastle.edu.au/aos/2025/min0026"}, {"label": "젠더 부전공 현재 학위 페이지", "url": "https://www.newcastle.edu.au/degrees/bachelor-of-arts-science"}], "intro": "호주 뉴사우스웨일스 해안의 공립 연구대학. 영국 Newcastle University와 다르다. Callaghan·도심·Ourimbah 등 실제 수강 캠퍼스를 확인해야 한다.", "department": "Psychological Science와 Gender and Sexuality 부전공(40 units)이 확인된다. 사회학·문화연구의 젠더 과목을 심리학과 함께 구성할 수 있다.", "faculty": "Justin Ellis의 2026 연구 소개는 알고리즘에 의한 아우팅과 온라인 퀴어 정체성 문제를 다룬다. 소속은 법·사회정의 영역이며 심리학과 교수로 소개하지 않는다. PSYC 2600의 과거 강의계획서에는 Cassandra Gauld가 담당자로 표시된다.", "career": "사회·성격심리학과 젠더·권력·미디어 주제를 연결하는 진로 탐색에 적합하다. 지역사회·정책·디지털 문화 관점의 연결은 가능하지만 연구 참여 자리가 확인된 것은 아니다.", "registration": "PSYC 2600은 입문 PSYC 1010·1020 수준의 배경지식을 전제한다. Gender and Sexuality 부전공 목록에 있어도 당해 연도 미개설 과목이 있다. 캠퍼스와 대면·온라인 형태를 각각 확인한다.", "housing": "교내외 주거 모두 가능하나 단국대 기존 팩트시트에는 주거 배정 미보장으로 표시된다. 방 종류·식사 포함 여부에 따라 공식 생활비 범위의 차이가 크다.", "support": "Study Abroad & Exchange 담당과 국제학생 도착 전 안내에서 수강·재정·OSHC를 안내한다. 도착 일정은 일반 학부 일정이 아닌 교환학생 안내와 맞춰야 한다.", "gender": "공식 Gender and sexuality support 안내에서 학생 지원 연결을 제공한다. 지역 LGBTQIA+ 커뮤니티 접근성과 실제 캠퍼스 지원 위치를 함께 살펴볼 수 있다.", "environment": "해안 도시로 따뜻한 여름과 비교적 온화한 겨울을 경험한다. 국제학생 공동체와 원주민 지원기관 Wollotuka가 있다. 시드니와 다른 도시이며, 캠퍼스 간 이동에 따라 교통 조건이 달라진다.", "environmentNote": "지역의 일반적 특성. 구체적인 인종 비율·범죄율은 비교 점수에 반영하지 않았다.", "budgetBasis": ["2026 공식 안내의 주당 생활비 AUD 370–610 × 22주 = 8,140–13,420. 주거 조건별 차이를 반영한 범위다.", "추정 추가: 교재 500 + OSHC 600 + 학생비 200 + 정착비 400 = 1,700. 현지 총액 AUD 9,840–15,120."], "risk": "2027-1 2→2명, 2026-2 2→2→2명. 이번 후보 중 반복 추가 모집의 근거가 비교적 뚜렷하지만 실제 경쟁률이나 미달 확정 통계는 아니다.", "mix": "PSYC 2600 + SOCA 2700 또는 SOCA 1050 + 허용되는 심리학/연구 과목. 공개된 과거 과목과 현행 부전공 목록을 조합한 탐색 예시다.", "coverage": "공식 Psychological Science Advanced 및 복수학위 페이지에 현재 노출된 공통 심리학 16개와 선택 3개를 합쳐 19개, 2026 Diploma 경로의 PSYC1800 추가. 전공 전체 핸드북은 JS 본문 추출 실패로 전체 편람 완전성 미확인. 젠더 부전공은 현재 학위 페이지에 확인된 4개만 수록하며 미개설 6개 명칭은 확보하지 못함. 학기별 일정은 미확인.", "safety": {"text": "SafeZone으로 보안팀·응급처치·긴급 지원에 연락하고 안전 알림을 받을 수 있습니다. 혼자 공부할 때 체크인 타이머를 사용할 수 있으며, 요청·체크인 시 위치가 공유됩니다. Callaghan에는 공식 안내상 18:30~01:00 보안 셔틀이 있고 Jesmond·Shortland·Birmingham Gardens·Waratah West 등 정해진 인근 구역까지 운행합니다(4921 5888, 3번). Safe Walk는 Callaghan·Ourimbah 캠퍼스 안에서 건물·차량 사이 동행을 제공하며, 24/7 요청 가능하지만 인력 사정에 따라 지연될 수 있고 15분 전 연락을 권장합니다. 캠퍼스 밖 동행은 포함되지 않습니다. NSW BOCSAR는 2026-09-16 갱신 자료에서 LGA별 2026년 6월까지, suburb별 2025년까지의 경찰 기록 사건자료를 제공합니다. 이번 조사에서 Callaghan 및 개별 숙소의 수치를 동일 기준으로 추출하지 않아 지역 위험도를 단정하지 않았습니다.", "sources": [{"label": "SafeZone 기능·위치정보 안내", "url": "https://www.newcastle.edu.au/campus-life/security-safety-and-help/safezone"}, {"label": "야간 셔틀·Safe Walk 운영범위", "url": "https://www.newcastle.edu.au/campus-life/security-safety-and-help/getting-around-campus-at-night"}, {"label": "NSW BOCSAR 공식 사건자료 및 공개 범위", "url": "https://bocsar.nsw.gov.au/statistics-dashboards/open-datasets/criminal-offences-data.html"}]}, "composition": {"text": "이번에 확인한 공식 국제학생 자료와 유입 교환학생 관련 검색에서 교환학생만의 국적·지역별 구성표는 확보하지 못했습니다. 전체 국제학생 수나 국제학생 출신국 수는 교환학생 코호트의 구성을 뜻하지 않으므로 대체 수치로 제시하지 않습니다.", "sources": [{"label": "국제학생·교환 프로그램 공식 자료", "url": "https://www.newcastle.edu.au/__data/assets/pdf_file/0003/1082631/CIE_2026_Prospectus_DIGITAL_FA_V2_JUN_2026.pdf"}]}}, {"id": "edgehill", "name": "에지힐 대학교", "en": "Edge Hill University", "country": "영국", "city": "잉글랜드 · 옴스커크", "period": "1학기", "months": 5, "quota": ["4", "1"], "history": ["2", "—", "—"], "score": [7, 8.5, 8], "tag": "기숙사 생활 · 임상·법정심리 탐색", "world": "비교 가능한 종합순위 미확인", "worldsrc": "", "psych": 1297, "psychsrc": "https://edurank.org/uni/edge-hill-university/rankings/", "budget": {"name": "Edge Hill", "cur": "GBP", "lo": 5516, "hi": 6198, "airlo": 150, "airhi": 230, "visa": 30, "krwLow": 1350, "krwHigh": 1580}, "courses": [{"group": "심리학", "code": "PSY1112", "title": "인지·생물심리학 입문", "credit": "20 UK credits", "description": "인지·생물학적 심리학의 기초.", "fit": "심리학 기초·응용 진로의 폭을 넓히는 과목.", "caution": "1월 제한시간 평가; 귀국 후 응시 시 온라인 접속 필요.", "status": "공식 교환학생용 편람", "url": "https://www.edgehill.ac.uk/departments/support/international/study-abroad-and-erasmus/module-catalogue/", "term": "Semester 1 (가을)"}, {"group": "심리학", "code": "PSY3122", "title": "물질 오용의 심리학", "credit": "20 UK credits", "term": "Semester 1 (가을)", "description": "물질 사용·보상·중독과 개입.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "심리학 Level 5 또는 동등 수준 이수 필요.", "status": "공식 교환학생용 편람", "url": "https://w 3", "title": "공연·젠더·성 정치", "credit": "20 UK credits", "term": "Full year (연간)", "description": "희곡·공연으로 젠더 규범 탐구.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "연간 파견 전용. 공연 실기·전공 선수지식 등 승인 확인.", "status": "공식 교환학생용 편람", "url": "https://www.edgehill.ac.uk/departments/support/international/study-abroad-and-erasmus/module-catalogue/"}], "sources": [{"label": "심리학과·교수진", "url": "https://www.edgehill.ac.uk/departments/academic/psychology/"}, {"label": "교환 2026–27 팩트시트", "url": "https://www.edgehill.ac.uk/document/exchange-factsheet/exchange-edge-hill-factsheet-26-27/"}, {"label": "Forest Court 비용", "url": "https://www.edgehill.ac.uk/study/accommodation/forest-court/"}, {"label": "국제학생 기숙사", "url": "https://www.edgehill.ac.uk/study/accommodation/international/"}, {"label": "트랜스 학생 지원", "url": "https://www.edgehill.ac.uk/departments/support/studentservices/student-support-team/support-for-transgender-students/"}, {"label": "교환학생용 전체 모듈 편람", "url": "https://www.edgehill.ac.uk/departments/support/international/study-abroad-and-erasmus/module-catalogue/"}], "intro": "리버풀 인근 옴스커크의 캠퍼스 대학. 비교적 저렴한 기숙사 옵션과 심리학 방문학생 과목 안내가 장점이다. 리버풀 도심에서 생활하는 조건과는 다르다.", "department": "심리학과에서 인지·생물·사회·발달 및 임상·법정심리 관련 모듈을 검토할 수 있다. 독립적인 젠더·퀴어 학부 전공은 이번 조사에서 확인하지 못했다.", "faculty": "학과의 연구·교수진 안내는 확인했으나 이번 비교에 직접 연결되는 퀴어 정체화 연구 지도교수는 특정하지 못했다. 연구실 참여 가능성은 점수에 포함하지 않았다.", "career": "심리학의 폭넓은 기초와 임상·법정 분야를 체험하려는 경우 적합하다. 퀴어 이론을 집중적으로 공부하려는 목표에는 확인된 과목 수가 적다.", "registration": "가을·봄 모듈을 구분해야 한다. PSY 2116 Research Methods and Data Analysis는 연간 과목이므로 한 학기 교환에서 전체 이수를 가정하지 않았다.", "housing": "기존 단국대 팩트시트에는 교내 기숙사 의무·보장으로 기재되어 있다. 다만 최종 배정 절차·기한은 새 안내를 따르며, 공식 Forest Court의 일반 40주 계약을 22주만 결제할 수 있는지는 미확인이다. 2026/27 교환 팩트시트의 1인실 보장과 Erasmus 전용 웹페이지의 미보장 안내가 달라, 적용 프로그램과 신청 기한을 확인해야 한다.", "support": "International Office의 Study Abroad 담당과 교환학생 팩트시트에서 모듈·기숙사·도착 절차를 안내한다.", "gender": "Student Support Team에 transgender students를 위한 지원 안내가 있다. 이름·학적·생활 적응 등 실제 요청별 담당 창구를 확인할 수 있다.", "environment": "영국 북서부의 소도시 캠퍼스이며 리버풀 방문에는 교통비·시간이 든다. 비가 잦고 겨울은 서늘하며 일조시간이 짧다. 캠퍼스 주변의 최신 인종 구성 자료는 확보하지 못했다.", "environmentNote": "지역 정성 안내. 대학 지원 정책으로 주변 주민 전체의 태도를 일반화하지 않았다.", "budgetBasis": ["2026–27 Forest Court 주당 GBP 93–124(공과금 포함). 22주를 가정해 방 비용 2,046–2,728.", "식비·개인비·교재·통신·여가 등 주당 135 ×22 + 정착 300 + 보험 200을 추정 추가. 합계 GBP 5,516–6,198.", "22주 계약 허용 미확인. 40주 전액 계약이면 방 비용만 GBP 1,674–2,232가 더 발생해 약 350–470만원(예비비 포함) 증가 가능."], "risk": "2027-1은 4→1명. 1차에는 동반 지원 규모였지만 2차 한 자리로는 두 사람 동시 선발이 불가능하다. 미래 모집 인원은 미확정이다.", "mix": "봄에는 PSY 1111 + 3140 + 3150을 중심으로 허용 학점 구성 검토. 가을 모듈 또는 연간 과목을 같은 한 학기에 넣지 않는다.", "coverage": "2026-09-17 수정된 공식 교환학생 편람의 Psychology Provision 19개 전부(가을3·봄9·연간7), 편람 전체에서 제목에 Gender/Sexual/Women이 명시된 젠더 관련 5개 전부(봄2·연간3)를 수록. 대학의 모든 학부 강의 전체가 아니라 교환학생용 편람 기준. 타 학과의 제목에 명시되지 않은 젠더 내용이나 스포츠 전공의 심리학 모듈은 전체 추출 범위 밖. 학부 모듈은 안내상 각20 UK학점. 전공 간 수강 승인 및 파견기간과 연간과목의 호환성은 별도 확인.", "safety": {"text": "공식 국제학생 안내에 따르면 캠퍼스 보안은 24시간 운영됩니다. 기숙사는 잠금장치가 있는 개인실과 건물 출입카드를 사용하며 차량 진입을 제한합니다. 생활시설이 캠퍼스 안에 모여 있어 야간 이동거리를 줄일 수 있으나, 이것만으로 범죄위험이 낮다고 단정하지 않습니다. 비교 가능한 연도별 캠퍼스 범죄 통계는 이번 확인 범위에서 확보하지 못했습니다. 실제 기숙사 배정 위치와 도심·역 왕복 동선을 확인하는 것이 필요합니다.", "sources": [{"label": "Edge Hill 국제학생 안내·Safety", "url": "https://www.edgehill.ac.uk/departments/support/international/about-us/"}]}, "composition": {"text": "공식 2026/27 교환 팩트시트, incoming Erasmus 안내와 대학 학생 통계에서 입국 교환학생만을 분리한 국가별 인원·비율표를 찾지 못했습니다. 유럽 협정대학 50개 이상이라는 수치는 협정망 규모이며 실제 교환학생 출신국 구성과 다릅니다. 전체 학생 수나 국제학생 홍보자료를 교환학생 국적·인종 구성으로 대체하지 않았습니다.", "sources": [{"label": "2026/27 Exchange Factsheet", "url": "https://www.edgehill.ac.uk/document/exchange-factsheet/exchange-edge-hill-factsheet-26-27/"}, {"label": "Incoming Erasmus 공식 안내", "url": "https://www.edgehill.ac.uk/departments/support/international/study-abroad-and-erasmus/erasmus/"}, {"label": "대학 전체 Facts and Figures", "url": "https://www.edgehill.ac.uk/about/facts-and-figures/"}]}}, {"id": "bradford", "name": "브래드퍼드 대학교", "en": "University of Bradford", "country": "영국", "city": "잉글랜 -Full-Report-2022.pdf"}, {"label": "2026/27 심리학 학사 전체 교육과정", "url": "https://www.bradford.ac.uk/courses/ug/psychology-bsc/"}, {"label": "상담 결합 심리학 과정 전체 교육과정", "url": "https://www.bradford.ac.uk/courses/ug/psychology-with-counselling-bsc/?att=ft"}], "intro": "산업·이민의 역사가 있는 도시의 공립대학. 상담과 심리학을 함께 검토할 수 있고 교내 주거 선택지가 있다.", "department": "Psychology with Counselling의 2026 커리큘럼에서 연구방법·사회·발달·상담을 확인했다. 젠더 관련 대학원 과목은 있으나 학부 교환학생 수강 가능성을 확인하지 못했다.", "faculty": "Hannah Intezar는 자기·정체성·젠더·디지털 환경과 연결되는 사회문화 심리학 및 질적 접근을 소개한다. 연구 주제의 적합성과 실제 지도·과목 수강 가능성은 별개의 조건이다.", "career": "상담의 관점과 사회문화적 자기·정체성 연구를 함께 탐색할 수 있다. 국내외 상담 자격이 교환학생 수업만으로 부여되는 것은 아니다.", "registration": "단국대 기존 자료의 Life Sciences 모듈 제한을 심리학 전체 불가로 단정하지 않았다. 반대로 심리학 학위과정 소개만으로 교환 수강 허용을 확정하지도 않았다. 모듈별 승인과 학기 배치를 받아야 한다.", "housing": "단국대 기존 팩트시트에는 교내 기숙사 의무·보장으로 표시된다. 최종 안내의 신청기한·계약기간·요금이 우선이며, 2025–26 비용으로 추정했기 때문에 갱신이 필요하다.", "support": "국제학생 Pre-arrival 안내와 학생 핸드북에서 도착·주거·학생 서비스를 확인할 수 있다. 상담 실습이나 임상 모듈은 일반 교환 지원과 별도 조건일 수 있다.", "gender": "학생 핸드북에 트랜스·논바이너리 관련 지원 안내가 있다. 교내 정책과 외부 임상 서비스의 접근 조건은 구분해 확인한다.", "environment": "남아시아·아프리카·카리브해 등 여러 이주 배경을 가진 공동체의 역사가 있고 다양한 문화·종교 공간이 공존한다. 서늘하고 비가 잦은 북부 잉글랜드의 도시 생활이며 겨울 낮이 짧다.", "environmentNote": "대학의 지역 사회통합 연구를 참고했다. 특정 종교·민족을 젠더 친화성의 대리 지표로 사용하지 않았다.", "budgetBasis": ["2025–26 공식 안내의 주당 비용: 임대 GBP 90–177, 공과금 0–30, 식비 60, 생활용품 15, 교재 10, 통신 10, 교통 20, 여가 20 = 225–342.", "22주 + 정착비 500 + 소지품 보험 70 + 의료·여행보험 200의 추정액. 현지 총액 GBP 5,720–8,294. 실제 기숙사 계약과 차이 가능."], "risk": "2027-1 4→3명, 2026-2 3→1명으로 추가 모집 이력이 있다. 심리학 수강 승인 가능성이 선발 이력보다 먼저 해소되어야 할 변수다.", "mix": "Social Psychology + Understanding Social and Developmental Psychology + 상담 입문 또는 연구방법. 실제 교환 허용 모듈 목록을 받기 전의 관심 분야 조합이다.", "coverage": "2026/27 Psychology BSc 공식 페이지의 고유 모듈25개 전체와 Psychology with Counselling 공식 페이지의 추가 고유 모듈5개를 통합. 상담 결합과정은 일부 공통 모듈의 배치 학년이 다름(세계화·이주·난민 및 교육전환은 상담과정에서2학년 선택). 학기·코드·학점은 개별 모듈 원문에서 확정하지 못해 미확인 표시. 이 목록은 학위 교육과정 전체이며 교환학생 허용 전체 목록과 동일하지 않음. 독립 학부 젠더 전공 전체 편람은 확인하지 못함.", "safety": {"text": "Richmond Building의 Security and Emergency Services는 주야간 상주하며 CCTV·출입통제와 SafeZone 앱을 운영합니다. SafeZone은 위치 기반 구조요청·응급처치·안전알림을 지원하고 캠퍼스 밖에서는 999 연락을 안내합니다. 괴롭힘·차별·성적 비행·혐오 사건은 Report + Support에서 익명 또는 실명으로 신고할 수 있습니다. The Green은 24시간 보안, CCTV, 구역별 출입키와 관리 인력을 안내합니다. 이번 조사에서는 대학별 비교에 쓸 수 있는 캠퍼스 범죄 시계열을 확보하지 못했습니다. 도시 전체 범죄통계와 실제 캠퍼스·기숙사 생활동선의 위험을 동일시하면 안 됩니다.", "sources": [{"label": "Bradford Safety and Security", "url": "https://www.bradford.ac.uk/student-life/safety"}]}, "composition": {"text": "2026/27 교환 팩트시트와 International Opportunities 팀 안내에서는 입국 교환학생의 국가별 인원·비율이 확인되지 않았습니다. 이 학교의 전체 국제학생 비율이나 지역 주민의 민족 구성을 교환학생 구성으로 대신 사용하지 않았습니다. 국가별 지원 안내나 협정기관 목록은 실제 입국 교환학생 집계가 아닙니다.", "sources": [{"label": "Bradford 2026/27 Exchange Factsheet", "url": "https://www.bradford.ac.uk/study/abroad/about/Fact-Sheet-202627.pdf"}, {"label": "International Opportunities Team", "url": "https://www.bradford.ac.uk/study/abroad/about/"}]}}, {"id": "curtin", "name": "커틴 대학교", "en": "Curtin University", "country": "호주", "city": "서호주 · 퍼스 Bentley", "period": "1학기", "months": 5, "quota": ["2", "1"], "history": ["4", "4", "—"], "score": [6.5, 7.5, 8.5], "tag": "성학 연구 환경 · 학부 과목 검증 필요", "world": "QS 2027 189위", "worldsrc": "https://www.topuniversities.com/universities/curtin-university", "psych": 297, "psychsrc": "https://edurank.org/uni/curtin-university/rankings/", "budget": {"name": "Curtin", "cur": "AUD", "lo": 12150, "hi": 17100, "airlo": 120, "airhi": 200, "visa": 250, "krwLow": 1680, "krwHigh": 2280}, "courses": [{"group": "심리학", "code": "PSYC1000", "title": "심리학 입문", "credit": "25 credits", "term": "학기 미확인", "description": "과목명 번역 기준 주제 안내입니다. 상세 강의계획서는 원문에서 확인해야 합니다.", "fit": "과목의 구체적 연구·진로 연결은 강의계획서와 관심 분야를 함께 검토하세요.", "caution": "과목명으로 주제만 번역. 상세 설명·선수과목·Perth 캠퍼스·교환학생 허용·개설학기 미확인. 4학년은 별도 진입 요건.", "status": "2026 공식 과목 요금표·편람 미확보", "url": "https://s30991.pcdn.co/wp-content/uploads/sites/8/2026/02/2026-Not-for-Degree-Domestic-Unit-Fees-1.pdf"}, {"group": "심리학", "code": "PSYC100 "}, {"label": "생활비·호주 생활", "url": "https://www.curtin.edu.au/study/international-students/living-australia/"}, {"label": "주거", "url": "https://www.curtin.edu.au/study/campus-life/accommodation/#perth"}, {"label": "학생 개인 지원", "url": "https://www.curtin.edu.au/students/personal-support/"}, {"label": "현행 심리학 핸드북", "url": "https://handbook.curtin.edu.au/courses/course-ug-bachelor-of-psychology--b-psychv3"}, {"label": "2026 공식 과목 코드·학점 요금표", "url": "https://s30991.pcdn.co/wp-content/uploads/sites/8/2026/02/2026-Not-for-Degree-Domestic-Unit-Fees-1.pdf"}, {"label": "대학의 비학위 요금표 안내", "url": "https://www.curtin.edu.au/study/help-support/app/answers/detail/a-id/3377/how-much-does-it-cost-to-study-units-as-not-for-degree/"}], "intro": "퍼스 Bentley에 주 캠퍼스를 둔 대규모 공립대학. 글로벌·산업 연계 성격이 있으나 정규 학위학생 대상 취업·실습 안내를 교환학생에게 그대로 적용할 수는 없다.", "department": "심리학 학사와 대학원 Sexology 과정이 확인된다. 성학 분야가 존재하는 것과 학부 교환학생이 해당 전문과목을 수강할 수 있는 것은 별개다. 현재 확인한 학부 성학 과목의 구체적 설명은 오래된 편람 자료다.", "faculty": "대학원 Sexology의 교육·연구 환경은 확인되지만, 현재 학부 교환학생이 접근할 수 있는 성학 지도교수·연구 자리는 확인하지 못했다. 특정 교수와의 협업 가능성을 점수에 포함하지 않았다.", "career": "심리학과 성학 분야의 향후 진학 방향을 살펴보기 좋다. 현재 학부 교환 수강 경로가 확인되기 전까지는 관심 분야가 있다는 이유만으로 우선순위를 높이지 않는 편이 타당하다.", "registration": "Inbound selecting courses에서 캠퍼스·선수과목·제한 전공을 확인해야 한다. 과거 COUN2000·SXLG3000·PSYC2001 코드는 현행 수강 확정 자료가 아니다. 대학원 성학 과정도 기본 수강안에서 제외했다.", "housing": "교내외 기숙사가 있으나 배정 보장으로 계산하지 않았다. 공식 최소 생활비와 높은 임대료 시나리오를 함께 사용했다. 교외 임대는 통학비와 계약기간을 더해 비교해야 한다.", "support": "Global Inbound의 Student Exchange 안내와 Go Global 담당이 과목 선택·교환 지원 절차를 안내한다. OSHC와 학생비가 수업료 면제와 별도로 발생한다.", "gender": "공식 개인 지원 안내에 성·젠더 다양성을 포함한 지원 경로가 있다. 구체적 서비스 위치·예약·교환학생 이용 조건은 파견 시점에 재확인해야 한다.", "environment": "퍼스는 아시아와의 연결이 있는 서호주 도시이며 다른 호주 동부 대도시와 거리가 멀다. 여름은 덥고 건조하고 겨울은 온화하며 비가 많다. 도심·Bentley·해변 생활권 사이 이동을 고려해야 한다.", "environmentNote": "다양한 국제학생이 모이는 환경이라는 정성 평가. 인종별 구성이나 차별 빈도는 미확인.", "budgetBasis": ["공식 생활 안내의 최소 주당 AUD 475를 하한, 주당 700을 상한 추정으로 두고 22주를 적용했다.", "교재 500 + OSHC 600 + 학생비 200 + 정착 400의 추정 1,700 추가. 현지 총액 AUD  const calc=()=>{const fx=Number(document.getElementById('fx').value),g=Number(document.getElementById('grant').value),out=document.getElementById('calc');if(!Number.isFinite(fx)||fx<=0||!Number.isFinite(g)||g<0){out.textContent='유효한 금액을 입력하세요';return}const lo=Math.max(0,Math.round(((b.lo*fx/10000+b.airlo+b.visa)*1.1-g)/10)*10),hi=Math.max(0,Math.round(((b.hi*fx/10000+b.airhi+b.visa)*1.1-g)/10)*10);out.textContent=range(lo,hi)+'만원'};document.getElementById('fx').oninput=calc;document.getElementById('grant').oninput=calc;calc();

function scholarships(){main.innerHTML=`<div class="callout">Curtin Global Merit 2027은 교환학생·Study Abroad 학생을 제외합니다. 정규 학위 장학금을 교환학생 경비에서 차감하지 마세요. ${a('https://scholarships.curtin.edu.au/Scholarship/?id=7986','공식 대상·제외 조건')}</div><a class="back" href="#overview">← 대학 비교로 돌아가기</a><div class="hero"><div><div class="eyebrow">FUNDING YOUR EXCHANGE</div><h1>장학금은 지원 목적부터 나눠보기.</h1><p>생활비 지원은 해외 예산에, 등록금 지원은 단국대 납부액에 반영합니다.</p></div></div>

 <section id="nanum" class="section"><div class="grid2"><div class="scholar-top"><span class="eyebrow" style="color:#aadac6">단국대학교 · 2027-1 공고</span><h2>나눔국제화장학금</h2><div class="scholar-number">1인 300만원</div><p>경제적 조건에 따른 국제 경험 접근을 지원하는 교내 장학금입니다. 대학별 자동 지급이 아니라 학생 개인의 자격과 우선순위를 기준으로 선발합니다.</p><small>모든 언어권 통합 15명 · 신청 절차·서류는 후속 안내</small><p>${a(DKU,'공식 교환학생 선발 공고')}</p></div><div class="card"><h3>지원구간에 따라 확인할 내용</h3><ul class="note-list"><li>공고 기준 <strong>학자금 지원구간 3 이하</strong>이며, 최종 선발된 파견 교환학생이 대상입니다.</li><li>선발 우선순위는 <strong>낮은 지원구간 → 높은 직전학기 평점 → 높은 전체 평점</strong> 순입니다.</li><li>정원이 15명이므로 요건 충족만으로 지급을 확정할 수 없습니다.</li><li>현재 공고에는 이 장학금의 특정 파견교 제한이 없어, 비교표의 11개교 모두 ‘나눔 조건부’로 표시했습니다.</li><li>어느 학기 지원구간 통지서를 제출할지, 지급 시점과 반환·중복 수혜 규정은 별도 장학 안내를 확인해야 합니다.</li></ul></div></div></section>
 <section id="mirae" class="section"><h2>미래에셋박현주재단 · 제36기</h2><div class="grid2"><div class="card"><h3>지원액과 기본 자격</h3><p>2027년 봄학기 1학기 생활비 지원이며 250명 이내 선발입니다. 미주·유럽·기타 지역은 850만원, 아시아는 650만원으로 공지되어 있습니다. 이번 후보의 국가는 모두 850만원 지역에 속합니다.</p><ul class="note-list"><li>대한민국 국적의 국내 4년제 대학 학부생으로 이공·상경·인문사회 계열 등 재단 대상 전공.</li><li>최초의 모교 교환 파견 여부, 본교 재학 유지·학점 인정 등 학적 조건 확인.</li><li>직전학기와 총평점 각각 3.0/4.5 또는 2.87/4.3 이상 기준 확인.</li><li><strong>2026-1 또는 2026-2 한국장학재단 지원구간 8 이하</strong> 통지서 등 필수 증빙 제출.</li></ul><small>최초 파견·세부 학적 조건은 재단 사전안내를 함께 참고했습니다. 신청에는 36기 최종 요강이 우선하며, 특정 개인의 자격을 판정한 결과가 아닙니다.</small></div><div class="card"><h3>기간·중복 지원에서 놓치기 쉬운 점</h3><ul class="note-list"><li>1년 파견이어도 이 공고는 한 학기 지원입니다. 850만원을 두 번 받는다고 계산하지 않습니다.</li><li><strong>SOU 1쿼터</strong>가 재단의 지원 기간·최소 이수 요건을 충족하는지는 별도로 확인해야 합니다.</li><li>나눔국제화 등 다른 생활비 장학과의 동시 수혜 가능 여부를 확인하기 전에는 단순 합산하지 않습니다.</li><li>재단 FAQ에 이수 과목·성적 유지·리포트 등 사후 의무가 안내되어 있습니다. 지원 시 최신 요강의 학업 의무와 반환 사유를 읽어야 합니다.</li><li>지원구간·성적 증빙 미제출은 심사 제외 사유로 공식 공고에 명시되어 있습니다.</li></ul>${sourceButtons([{label:'36기 최종 공고·요강',url:MIRAE},{label:'재단 사전 안내',url:'https://foundation.miraeasset.com/ko/news/notice/view.do?detailsKey=536'},{label:'재단 FAQ',url:'https://foundation.miraeasset.com/ko/scholar-foreign/guideLine/check.do'},{label:'지원액·일정 대학 공지',url:'https://cse.snu.ac.kr/ko/community/notice/25615'}])}</div></div></section>
 <section id="income" class="section"><h2>학자금 지원구간별 등록금 지원</h2><p>학자금 지원구간은 한국장학재단이 가구의 소득·재산 등을 심사해 정합니다. 일상적으로 말하는 ‘소득분위’와 완전히 같은 통계 개념은 아닙니다. 추정 소득만으로 자격을 판단하기보다 공식 통지서를 기준으로 확인합니다.</p><div class="table-shell"><table><thead><tr><th>2026 지원구간</th><th>국가장학금 Ⅰ유형<br>학기 최대</th><th>연간 최대</th><th>2027 개편 예정 명칭</th></tr></thead><tbody><tr><td>기초·차상위</td><td>등록금 전액</td><td>등록금 전액</td><td>기초·차상위</td></tr><tr><td>1–3구간</td><td>300만원</td><td>600만원</td><td>가</td></tr><tr><td>4–6구간</td><td>220만원</td><td>440만원</td><td>나</td></tr><tr><td>7–8구간</td><td>180만원</td><td>360만원</td><td>다</td></tr><tr><td>9구간</td><td>50만원</td><td>100만원</td><td>라</td></tr><tr><td>10구간</td><td>Ⅰ유형 미지원</td><td>Ⅰ유형 미지원</td><td>마</td></tr></tbody></table></div><div class="callout warn"><strong>금액은 2026 기준, 명칭 개편은 2027 예정입니다.</strong> 2027 최종 지원단가를 확정한 표가 아닙니다. 나눔·미래에셋 공고의 ‘3 이하’, ‘8 이하’가 어떤 학기의 통지서를 요구하는지 먼저 확인하고, 가·나·다 명칭으로 임의 대체하지 마세요. ${a(KOSAF,'2026 지원액')} · ${a(REFORM,'2027 구간 개편 안내')}</div>
 <div class="grid2"><div class="card"><h3>교환학생에게 적용하는 방식</h3><p>교환 기간에 단국대 등록금을 납부하는 학적이라면 본교 등록금 장학의 검토 대상이 될 수 있습니다. 다만 학적·성적·수혜 횟수·중복 지원 등 개인 조건과 교환학기 처리 방식은 단국대 장학 담당 확인이 필요합니다.</p><p>국가장학금 Ⅱ유형은 대학의 자체 기준에 따라 지원액이 달라집니다. 다자녀 장학 등 별도 자격에 해당하는 제도도 함께 살펴볼 수 있으나, 이 가이드에서 개인의 해당 여부를 추정하지 않습니다.</p><p><strong>계산 예:</strong> 본교 등록금 400만원, 등록금 장학 300만원이면 본교 부담은 100만원입니다. 해외 체류비 1,500만원에서 같은 300만원을 다시 빼면 중복 계산입니다.</p></div><div class="card"><h3>지원구간 통지서를 준비하는 순서</h3><ol class="steps"><li>당해 학기 국가장학금·학자금 신청 기간을 확인하고 재단에서 신청합니다.</li><li>필요한 서류 제출과 가구원 정보제공 동의를 완료합니다. 심사가 지연되면 통지서 발급도 늦어질 수 있습니다.</li><li>재단 신청현황에서 지원구간 산정 결과와 발급 가능한 통지서를 확인합니다.</li><li>각 장학금 공고가 요구하는 학기·발급일·제출 방식에 맞는 서류를 제출합니다.</li></ol><small>재단 안내상 통상 산정에 약 8주가 소요될 수 있습니다. 국가장학금 신청이 나눔·미래에셋 지원을 자동으로 대신하지는 않습니다.</small>${sourceButtons([{label:'지원구간 산정 절차',url:'https://www.kosaf.go.kr/ko/tuition.do?hmNavi=JH%2C01%2C01%2C00&pg=tuition04_09_01&type=scholar'},{label:'국가장학금 Ⅱ유형',url:'https://www.kosaf.go.kr/ko/scholar.do?pg=scholarship05_12_01_02'}])}</div></div></section>
 <section class="section"><h2>함께 확인할 장학금과 예산 원칙</h2><div class="grid2"><div class="card"><h3>교내 성적·가계지원 / 지역 재단</h3><p>단국대 교내 등록금 장학은 학과·학기별 규정, 교환학생 성적 처리에 따라 달라질 수 있습니다. 지역 인재육성재단·민간 재단은 거주·출신 학교·전공·중복 수혜 기준이 달라 별도 공고가 필요합니다.</p><p>현재 신청 가능한 특정 지역 재단을 확인하지 못해 금액을 기본 예산에 넣지 않았습니다. 호스트 대학의 ‘국제학생 입학 장학’도 정규 학위 신입생 전용일 수 있어 교환학생 지원으로 간주하지 않았습니다.</p></div><div class="card"><h3>총액보다 출국 전 현금도 보기</h3><p>최종 부담 = 해외 체류비 + 본교 등록금 − 확정 생활비 지원 − 확정 등록금 지원입니다. 등록금 장학은 등록금 범위 안에서만 반영합니다.</p><p>장학금이 출국 뒤 지급되면 항공·기숙사 보증금·보험·비자 준비 비용을 먼저 낼 수 있어야 합니다. ‘최종 선발’, ‘지급 예정’, ‘입금 완료’를 나누어 관리하면 이 차이를 놓치지 않을 수 있습니다.</p></div></div></section>${footer()}`}

function method(){main.innerHTML=`<a class="back" href="#overview">← 전체 비교</a><div class="eyebrow">READ THE EVIDENCE</div><h1>비교의 기준과 확인 범위.</h1><p>학교에 관한 사실, 자료의 빈칸, 비교자의 판단을 분리한 가이드입니다.</p><div class="grid2 section"><div class="card"><h2>모집·기간의 기준</h2><p>2027-1 단국대 모집 1·2차와 2026-2의 1·2·3차를 대조했습니다. 후보 전체가 현재 동시에 지원 가능한 명단은 아닙니다. 일부 학교는 2차에 한 자리만 남거나 미등재였고, 다음 모집은 아직 확인되지 않았습니다.</p><p>같은 대학·같은 전공 지원을 전제로 비교하되 두 학생의 개별 수강 승인이 필요합니다. SOU는 1쿼터, 애들레이드는 현재 1년으로 계산했습니다. 나머지 학교의 1년 연장을 자동 허용하지 않았습니다.</p>${sourceButtons([{label:'단국대 공고 및 첨부',url:DKU},{label:'대학별 파견 자료',url:NOTION}])}</div><div class="card"><h2>세 가지 점수 · 10점 척도</h2><p><strong>학문·진로:</strong> 심리학 기초·방법론, 퀴어 정체화 관심에 맞는 과목, 연구·진로 연결, 교환 수강의 실현 가능성을 함께 판단했습니다.</p><p><strong>비용:</strong> 총 현금뿐 아니라 체류 기간 대비 비용, 주거 예측 가능성을 고려한 상대 평가입니다. 가격에서 기계적으로 환산한 점수는 아닙니다.</p><p><strong>젠더:</strong> 관련 과목과 공식 학생 지원·주거 자원의 존재를 평가했습니다. 개인의 안전·차별 경험을 보장하거나 인종·종교를 점수화한 결과가 아닙니다.</p><small>주관적 탐색 점수이며 0.5점 차이는 사실상 동급으로 보세요. SOU·CPP·Curtin·Bradford는 개설·수강 허용 불확실성을 함께 읽어야 합니다. 합격률 점수나 하나의 종합 순위는 만들지 않았습니다.</small></div><div class="card"><h2>랭킹을 읽는 방법</h2><p>종합 순위는 확인 가능한 QS 2027, 미국 일부 학교는 대학이 발표한 US News 지역 공립대 순위를 표시했습니다. 지역·평가기관·연도가 다르므로 숫자를 한 줄로 정렬해 우열을 판단하지 마세요.</p><p>심리학 분야는 EduRank 2026의 세계 연구 성과 순위입니다. 학부 강의 평가나 교환학생 수업 만족도 순위가 아닙니다. 연구 중심 대학이 유리할 수 있어, 과목 구성 점수와 나란히 보도록 했습니다.</p><p>애들레이드는 통합 이후 심리학 분야 순위를 확정하지 못했으며, 더글러스도 비교 가능한 수치를 확인하지 못했습니다. 미확인은 전공 부재나 교육의 열세를 뜻하지 않습니다.</p></div><div class="card"><h2>예산의 공통 가정</h2><p>환율은 실시간 시세가 아닌 계산 가정입니다. USD 1,450원 · CAD 1,050원 · AUD 950원 · GBP 1,900원 · EUR 1,650원.</p><p>산식: (현지 비용 × 환율 ÷ 10,000 + 항공 예산 + 입국 준비 예산) × 1.10. 결과는 10만원 단위로 반올림합니다. 모든 금액은 1인 기준이며 2인은 단순 두 배입니다.</p><p>자료 연도가 다른 비용은 각 학교에 표시했습니다. 최소 생활비와 개인 항공·보험 가정은 확정 견적이 아닙니다. 수업료 면제는 양교 교환 협정 기준으로 확인하고, 단국대 등록금은 따로 더해야 합니다.</p></div></div>
 <section class="card"><h2>확인 단계별 표시</h2><div class="grid3 compact"><div><span class="badge blue">학기 개설 확인</span><p>공개 시간표 또는 방문학생 목록에서 해당 학기 표시를 확인. 여석과 실제 수강 허가는 별도입니다.</p></div><div><span class="badge">편람·프로그램 목록</span><p>과목·전공의 존재는 확인했지만 파견 학기 개설과 교환 허용까지 확정하지 않았습니다.</p></div><div><span class="badge warn">과거 자료·미확인·제외</span><p>오래된 편람, 대학원, inbound No 등입니다. 실제 수강 가능 과목처럼 기본 시간표에 넣지 않았습니다.</p></div></div><p><strong>남아 있는 빈칸:</strong> 학교별 신청자 수·최저 합격점수, 다음 모집의 인원, 일부 현재 학기 과목·교수 배정, 단기 기숙사 계약, 프라임국제화의 현행 지정교, 미래에셋의 쿼터 파견·장학 중복 세부 적용은 확인이 더 필요합니다.</p></section>${footer()}`}

function route(){const parts=location.hash.slice(1).split('/'),page=parts[0]||'overview';const key=page==='school'?'school/'+parts[1]:page;let rendered=key!==currentPage;if(rendered){currentPage=key;if(page==='school'){const s=schools.find(s=>s.id===parts[1]);if(s){detail(s);document.title=s.name+' | 교환학생 비교 가이드'}else{overview();currentPage='overview';document.title='교환학생 비교 가이드'}}else if(page==='scholarships'){scholarships();document.title='장학금 | 교환학생 비교 가이드'}else if(page==='method'){method();document.title='자료·비교 기준 | 교환학생 비교 가이드'}else{overview();document.title='교환학생 비교 가이드 | 11개 대학'}document.querySelectorAll('[data-nav]').forEach(x=>{if(x.dataset.nav===page)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});window.scrollTo(0,0)}const anchor=page==='school'?parts[2]:parts[1];if(anchor){const el=document.getElementById(anchor);if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'auto'}))}else if(rendered){main.focus({preventScroll:true})}}
